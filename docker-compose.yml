services:
  tradingagents-dashboard:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    entrypoint: ["python", "-m", "uvicorn", "api_server:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - tradingagents_app_data:/home/appuser/app/.tradingagents-data
      - tradingagents_cli_data:/home/appuser/.tradingagents
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  tradingagents-cli:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_cli_data}:/home/appuser/.tradingagents
      - tradingagents_app_data:/home/appuser/app/.tradingagents-data
    tty: true
    stdin_open: true

  # Upstream CLI alias preserved for backwards compatibility
  tradingagents:
    build: .
    env_file:
      - .env
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_cli_data}:/home/appuser/.tradingagents
      - tradingagents_app_data:/home/appuser/app/.tradingagents-data
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  tradingagents-ollama:
    build: .
    env_file:
      - .env
    environment:
      - TRADINGAGENTS_LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434/v1
    volumes:
      - ${TRADINGAGENTS_DATA_DIR:-tradingagents_cli_data}:/home/appuser/.tradingagents
      - tradingagents_app_data:/home/appuser/app/.tradingagents-data
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  tradingagents_app_data:
  tradingagents_cli_data:
  ollama_data:
